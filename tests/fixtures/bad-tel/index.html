<!doctype html>
<html>
<head><title>Bad Telephone Fixture</title></head>
<body>
  <h1>Bad Telephone Links</h1>
  <!-- Too short digits -->
  <a href="tel:123">Too short</a>
  <!-- Non-phone letters -->
  <a href="tel:call-us-now">Invalid chars</a>
  <!-- Empty tel -->
  <a href="tel:">Empty tel</a>
  <!-- Non-normalized formatting -->
  <a href="tel:(+91) 98765-43210">Non-normalized tel with spaces and parens</a>
</body>
</html>
