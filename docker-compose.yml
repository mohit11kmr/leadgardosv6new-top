services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadguard
      POSTGRES_PASSWORD: leadguard
      POSTGRES_DB: leadguard
    ports: ["15432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadguard -d leadguard"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["16380:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
